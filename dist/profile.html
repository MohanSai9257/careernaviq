<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Manage your CareerNaviq profile.">
  <title>Profile — CareerNaviq</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="/sidebar.js" defer></script>
  <script src="/profile.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap brand"><img class="brand-logo" src="/logo.svg" alt=""><span>CareerNaviq</span><div id="profile-greeting" class="profile-greeting" hidden></div><div class="role-control"><span id="profile-role" class="public-label">User</span><button id="profile-logout" type="button">Logout</button></div></div>
  </header>
  <main id="profile-page" class="wrap" hidden>
    <h1 class="recruiter-heading">Profile</h1>
    <section class="profile-card">
      <form id="profile-form">
        <p class="form-hint">Share only what you’re comfortable with. All profile details are optional.</p>
        <div class="profile-fields">
          <label>First Name<input id="profile-first" name="firstName" maxlength="80" autocomplete="given-name"></label>
          <label>Last Name<input id="profile-last" name="lastName" maxlength="80" autocomplete="family-name"></label>
          <label>Gmail<input id="profile-email" name="email" type="email" readonly></label>
          <label>Mobile Number<input id="profile-mobile" name="mobile" type="tel" maxlength="40" autocomplete="tel"></label>
          <label>Status<select id="profile-status" name="visaStatus"><option value="">Select status</option><option value="OPT">OPT</option><option value="STEMOPT">STEMOPT</option><option value="CPT">CPT</option><option value="H1B">H1B</option><option value="H4">H4</option></select></label>
        </div>
        <p id="profile-message" role="status" aria-live="polite"></p>
        <button type="submit" class="primary">Save profile</button>
      </form>
    </section>
  </main>
</body>
</html>
