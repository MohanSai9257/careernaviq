<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profile — Employer Directory</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/sidebar.js" defer></script>
  <script src="/profile.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap brand"><span class="mark" aria-hidden="true">E</span><span>EMPLOYER DIRECTORY</span><div class="role-control"><span id="profile-greeting" class="profile-greeting" hidden></span><span id="profile-role" class="public-label">User</span><button id="profile-logout" type="button">Logout</button></div></div>
  </header>
  <main id="profile-page" class="wrap" hidden>
    <h1 class="recruiter-heading">Profile</h1>
    <section class="profile-card">
      <form id="profile-form">
        <div class="profile-fields">
          <label>First Name<input id="profile-first" name="firstName" required maxlength="80" autocomplete="given-name"></label>
          <label>Last Name<input id="profile-last" name="lastName" required maxlength="80" autocomplete="family-name"></label>
          <label>Gmail<input id="profile-email" name="email" type="email" readonly></label>
          <label>Mobile Number<input id="profile-mobile" name="mobile" type="tel" required maxlength="40" autocomplete="tel"></label>
          <label>Status<select id="profile-status" name="visaStatus" required><option value="">Select status</option><option value="OPT">OPT</option><option value="STEMOPT">STEMOPT</option><option value="CPT">CPT</option><option value="H1B">H1B</option><option value="H4">H4</option></select></label>
        </div>
        <p id="profile-message" role="status" aria-live="polite"></p>
        <button type="submit" class="primary">Save profile</button>
      </form>
    </section>
  </main>
</body>
</html>
