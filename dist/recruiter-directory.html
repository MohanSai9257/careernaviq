<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recruiter Directory</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="masthead">
    <div class="wrap brand"><span class="mark" aria-hidden="true">E</span><span>EMPLOYER DIRECTORY</span><div class="role-control"><span id="section-role" class="public-label">User</span><button id="section-logout" type="button">Logout</button></div></div>
  </header>
  <main id="recruiter-page" class="wrap" hidden>
    <h1 class="recruiter-heading" id="section-title">Recruiter Directory</h1>
    <nav class="category-tabs section-tabs" role="tablist" aria-label="Job categories">
      <button type="button" role="tab" id="tab-java" aria-selected="true" aria-controls="section-panel">Java</button>
      <button type="button" role="tab" id="tab-data" aria-selected="false" aria-controls="section-panel" tabindex="-1">Data</button>
      <button type="button" role="tab" id="tab-devops" aria-selected="false" aria-controls="section-panel" tabindex="-1">DevOps</button>
      <button type="button" role="tab" id="tab-validation" aria-selected="false" aria-controls="section-panel" tabindex="-1">Validation</button>
    </nav>
    <section id="section-panel" class="section-panel" role="tabpanel" aria-labelledby="tab-java"></section>
  </main>
  <script src="/sidebar.js" defer></script>
  <script>
    fetch('/api/session',{cache:'no-store'}).then(response=>response.json()).then(session=>{
      if(session.status==='approved') { document.body.classList.add('has-access'); document.getElementById('recruiter-page').hidden=false; document.getElementById('section-role').textContent=session.role==='admin'?'Admin':session.role==='coadmin'?'Coadmin':'User'; }
      else location.replace('/');
    }).catch(()=>location.replace('/'));
    document.getElementById('section-logout').addEventListener('click',()=>fetch('/api/logout',{method:'POST'}).then(()=>location.replace('/')));
    const tabs=[...document.querySelectorAll('.section-tabs [role="tab"]')];
    function selectTab(tab){for(const item of tabs){const selected=item===tab;item.setAttribute('aria-selected',String(selected));item.tabIndex=selected?0:-1;}document.getElementById('section-panel').setAttribute('aria-labelledby',tab.id);}
    for(const tab of tabs){tab.addEventListener('click',()=>selectTab(tab));tab.addEventListener('keydown',event=>{if(event.key!=='ArrowRight'&&event.key!=='ArrowLeft')return;event.preventDefault();const offset=event.key==='ArrowRight'?1:-1;const next=tabs[(tabs.indexOf(tab)+offset+tabs.length)%tabs.length];selectTab(next);next.focus();});}
  </script>
</body>
</html>
