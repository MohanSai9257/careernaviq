<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recruiter Directory</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/sidebar.js" defer></script>
  <script src="/section.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap brand"><span class="mark" aria-hidden="true">E</span><span>EMPLOYER DIRECTORY</span><div class="role-control"><span id="section-role" class="public-label">User</span><button id="section-logout" type="button">Logout</button></div></div>
  </header>
  <main id="recruiter-page" class="wrap" hidden>
    <h1 class="recruiter-heading" id="section-title">Recruiter Directory</h1>
    <nav class="category-tabs section-tabs" role="tablist" aria-label="Job categories">
      <button type="button" role="tab" id="tab-java" aria-selected="true" aria-controls="section-panel">Java</button>
      <button type="button" role="tab" id="tab-data" aria-selected="false" aria-controls="section-panel" tabindex="-1">Data</button>
      <button type="button" role="tab" id="tab-devops" aria-selected="false" aria-controls="section-panel" tabindex="-1">DevOps</button>
      <button type="button" role="tab" id="tab-validation" aria-selected="false" aria-controls="section-panel" tabindex="-1">Validation</button>
    </nav>
    <section id="section-panel" class="section-panel" role="tabpanel" aria-labelledby="tab-java">
      <div class="toolbar section-toolbar">
        <label class="search"><span class="sr-only">Search this category</span><input id="section-search" type="search" placeholder="Search" autocomplete="off"></label>
        <label id="date-filter-wrap" class="date-filter" hidden><span class="sr-only">Posted within</span><select id="date-filter"><option value="all">Any time</option><option value="day">Past 24 hours</option><option value="week">Past week</option><option value="month">Past month</option></select></label>
        <button id="section-add" type="button" class="primary">Add recruiter</button>
      </div>
      <p id="section-status" class="section-status" role="status" aria-live="polite"></p>
      <div id="section-items" class="section-items"></div>
    </section>
  </main>
  <dialog id="section-dialog" aria-labelledby="section-dialog-title">
    <form id="section-form">
      <h2 id="section-dialog-title">Add recruiter</h2>
      <p id="section-form-note" class="edit-scope">Your submission will appear after Admin approval.</p>
      <label for="section-title-input" id="section-title-label">Recruiter name</label><input id="section-title-input" name="title" required maxlength="200">
      <label for="section-organization" id="section-organization-label">Company</label><input id="section-organization" name="organization" maxlength="200">
      <label for="section-url" id="section-url-label">Link</label><input id="section-url" name="url" type="url" placeholder="https://">
      <label for="section-details">Details</label><textarea id="section-details" name="details" rows="4" maxlength="2000"></textarea>
      <div id="section-posted-wrap" hidden><label for="section-posted">Posted date and time</label><input id="section-posted" name="postedAt" type="datetime-local"></div>
      <p id="section-form-error" role="alert" hidden></p>
      <div class="dialog-actions"><button id="section-cancel" type="button">Cancel</button><button type="submit" class="primary">Submit</button></div>
    </form>
  </dialog>
</body>
</html>
